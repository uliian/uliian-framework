import org.springframework.boot.gradle.plugin.SpringBootPlugin
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

buildscript {
    ext {
        global_version = '2.1.8'
        kotlin_version = '2.4.21'
        guava_version = '31.1-jre'
        mybatis_plus_version = "3.5.18.1"
        aliyun_repository = 'https://maven.aliyun.com/repository/public/'
        kotlin_jackson_module_version = '2.13.3'
        swagger_version = '3.2.0'
        springboot_version = '4.1.2'
    }
    repositories {
        mavenLocal()
        maven { url "https://maven.aliyun.com/nexus/content/repositories/gradle-plugin" }
        maven { url aliyun_repository }
        mavenCentral()
    }

    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:$springboot_version")
    }
}
plugins {
    id("org.springframework.boot") version "$springboot_version" apply false
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm' version "$kotlin_version" apply false
    id 'org.jetbrains.kotlin.plugin.spring' version "$kotlin_version" apply false
    id 'org.jetbrains.dokka' version '2.2.0' apply false
    id 'org.jetbrains.dokka-javadoc' version '2.2.0' apply false
//    id 'maven-publish'
}
def kotlinBomVersion = kotlin_version

subprojects {
    apply plugin: 'org.jetbrains.kotlin.plugin.spring'
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    ext['kotlin.version'] = kotlinBomVersion

    if(!project.name.contains("demo")) {
        apply from: "${project.rootDir}${File.separator}upload.gradle"
    }else {
        apply plugin: 'org.springframework.boot'
    }
    dependencies {
        api('com.uliian:uliian-commons:1.5.11')
        implementation 'org.springframework.boot:spring-boot-configuration-processor'
    }

//    apply plugin: 'org.springframework.boot'
    dependencyManagement {
        imports {
            mavenBom SpringBootPlugin.BOM_COORDINATES
        }
    }
}
allprojects {
    apply(['plugin': 'java'])
    apply plugin: 'idea'
    apply plugin: 'org.jetbrains.kotlin.jvm'

    [compileJava, compileTestJava, javadoc]*.options*.encoding = 'UTF-8'


    group = 'com.uliian'
    version = global_version
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    test {
        useJUnitPlatform()
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
        }
    }

    repositories {
        mavenLocal()
        maven { url aliyun_repository }
        mavenCentral()
    }

    dependencies {
        testImplementation group: 'org.jetbrains.kotlin', name: 'kotlin-test-junit5', version: kotlin_version
    }

}

tasks.register("maven-release-ready") {
    doLast {
        if (!ossrhUsername || !ossrhPassword) {
            throw new GradleException("ossrhUsername and ossrhPassword are required")
        }

        def raw = "${ossrhUsername}:${ossrhPassword}"
        def bearerToken = java.util.Base64.getEncoder().encodeToString(raw.getBytes("UTF-8"))

        def url = new URL("https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/com.uliian")
        def connection = (HttpURLConnection) url.openConnection()
        connection.setRequestMethod("POST")
        connection.setRequestProperty("Authorization", "Bearer ${bearerToken}")
        connection.setDoOutput(false)

        def responseCode = connection.responseCode
        def stream = responseCode >= 200 && responseCode < 300 ? connection.inputStream : connection.errorStream
        def body = stream != null ? stream.getText("UTF-8") : ""

        println("HTTP ${responseCode}")
        if (body) {
            println(body)
        }
    }
}

