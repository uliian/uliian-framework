dependencies {
	implementation "org.springframework.boot:spring-boot-starter-web"
	implementation "org.springframework.boot:spring-boot-jackson2"
	implementation "org.springframework.boot:spring-boot-starter-aspectj"
	implementation project(":uliian-framework-web-starter")
	implementation project(":uliian-framework-mybatis-plus-starter")
	implementation project(":uliian-framework-oss-starter")
	implementation "com.baomidou:mybatis-plus-spring-boot4-starter:$mybatis_plus_version"
	implementation "com.baomidou:mybatis-plus-extension:$mybatis_plus_version"
	implementation "com.baomidou:mybatis-plus-jsqlparser:$mybatis_plus_version"

	runtimeOnly 'com.h2database:h2'
	implementation group: 'mysql', name: 'mysql-connector-java', version: '8.0.12'
}
