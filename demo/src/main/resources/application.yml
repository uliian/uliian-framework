spring:
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  application:
    name: demo
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 888888aa
    hikari:
      idle-timeout: 10000
      maximum-pool-size: 100
      minimum-idle: 3
  sql:
    init:
      mode: always

framework:
  easy-generator:
    time-wait: 1000
    node-id: 5
#    cidr: 10.0.0.0/8
#    cidr: 192.168.9.0/24
springdoc:
  swagger-ui:
    path: /swagger-ui.html
logging:
  level:
    com.uliian.framework.demo.db.mapper.SysRoleMapper: debug